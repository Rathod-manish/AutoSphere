spring.application.name=VehicleServiceReminder

# =========================================================
# SERVER
# =========================================================
server.port=${PORT:8082}

# =========================================================
# AIVEN MYSQL
# Put only the password in STS > Run Configurations > Environment
# as AIVEN_MYSQL_PASSWORD. Never commit the password here.
# =========================================================
spring.datasource.url=jdbc:mysql://mysql-24fece7b-anurag-ebbf.e.aivencloud.com:19261/defaultdb?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=avnadmin
spring.datasource.password=${AIVEN_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# =========================================================
# JWT
# =========================================================
app.jwt.secret=${JWT_SECRET:VSR_Local_9f4c2a71d8e34b6fa1c7e5d902ab43f8c6e1d7b9a4f2c8e6d1b3a7f5c9e2d4b8}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =========================================================
# CORS
# =========================================================
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# =========================================================
# SAFE ERROR RESPONSE
# =========================================================
server.error.include-message=never
server.error.include-stacktrace=never

# =========================================================
# GEMINI AI
# Put GEMINI_API_KEY in STS environment variables.
# =========================================================
app.ai.api-key=${GEMINI_API_KEY:}
app.ai.model=${GEMINI_MODEL:gemini-3.8-flash}
app.ai.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# =========================================================
# VEHICLE VISUAL / 360 IMAGE ENGINE (OPTIONAL)
# Free developer evaluation tier is enough for a project demo.
# Put CAR_IMAGE_API_KEY in STS environment variables.
# =========================================================
app.visuals.api-key=${CAR_IMAGE_API_KEY:}
app.visuals.base-url=${CAR_IMAGE_BASE_URL:https://carimage.dev/api/v1}
